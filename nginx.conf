events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1024;

    upstream analytics_backend {
        least_conn;
        server currency-analytics:8000 max_fails=3 fail_timeout=30s;
        # server currency-analytics-2:8000 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 80;
        server_name anton-analytics.ru www.anton-analytics.ru;

        # Let's Encrypt HTTP-01 challenge. Certbot (see
        # scripts/init_letsencrypt.sh) writes its proof files under this
        # path; it must stay reachable over plain HTTP even with the
        # redirect below, or every future renewal (`certbot renew`)
        # fails silently until the certificate expires.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl http2;
        server_name anton-analytics.ru www.anton-analytics.ru;

        # Let's Encrypt certificate for anton-analytics.ru. Obtained once
        # with scripts/init_letsencrypt.sh and auto-renewed by certbot's
        # own systemd timer/cron on the host (see README's "Деплой на
        # домен" section) - this container only ever reads it, mounted
        # read-only from the host's /etc/letsencrypt in
        # docker-compose.prod.yml.
        ssl_certificate /etc/letsencrypt/live/anton-analytics.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/anton-analytics.ru/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Безопасность.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        client_max_body_size 5m;

        # Renewal keeps working once the site is already on HTTPS too,
        # since some certbot configurations re-verify over plain HTTP.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Приложение не отдаёт файлы из /static/ (нет смонтированной
        # директории со статикой - см. src/main.py), поэтому здесь нет
        # отдельного location для неё: всё, включая /favicon.ico,
        # проксируется на backend через location / ниже.
        location / {
            proxy_pass http://analytics_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_buffering off;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Health check.
        location /health {
            proxy_pass http://analytics_backend/health;
            access_log off;
        }
    }
}
