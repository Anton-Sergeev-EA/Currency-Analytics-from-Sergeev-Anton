global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'currency-analytics'
    static_configs:
      - targets: ['currency-analytics:8000']
    metrics_path: '/metrics'

  # A 'redis' job used to be listed here, but Redis isn't reachable at
  # that name: it isn't a service in docker-compose.yml at all (the app
  # talks to it at the host's 172.17.0.1:6379), and Redis doesn't expose
  # a Prometheus /metrics endpoint on its own anyway - that needs the
  # separate redis_exporter sidecar, which this project doesn't run.
  # Removed rather than left in place scraping nothing.
