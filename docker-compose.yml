services:
  currency-analytics:
    build:
      context: .
      dockerfile: Dockerfile
    image: currency-analytics:${APP_VERSION:-latest}
    # No container_name here: docker-compose.prod.yml scales this service
    # to 2 replicas, and a fixed container_name is incompatible with
    # that ("can't set container_name ... container name must be
    # unique") - Compose would refuse to bring the prod stack up at all.
    # nginx.conf and the Makefile already address it by service name
    # (currency-analytics), which round-robins across replicas on its
    # own, so nothing relied on the fixed name.
    restart: unless-stopped
    user: "0:0"
    ports:
      - "8002:8000"
    environment:
      - REDIS_URL=redis://172.17.0.1:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - CBR_API_URL=${CBR_API_URL:-https://www.cbr.ru/scripts/XML_daily.asp}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://anton-analytics.ru,https://www.anton-analytics.ru,http://localhost:8002,http://127.0.0.1:8002}
      - DATA_PATH=/app/data
      - OLLAMA_HOST=${OLLAMA_HOST:-http://172.17.0.1:11434}
      # tinyllama matches the app's own default (src/core/config.py,
      # src/infrastructure/rag/llm/ollama_client.py) - was llama3.2:3b
      # here, a third, different default from either of those. On a
      # 4GB-RAM VDS, stick to tinyllama or another 1-2B model: anything
      # bigger competes with the app itself (pandas/lightgbm/xgboost) for
      # the same RAM and will get OOM-killed alongside it.
      - OLLAMA_MODEL=${OLLAMA_MODEL:-tinyllama}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://172.17.0.1:11434}
      - USE_OLLAMA=${USE_OLLAMA:-True}
      # MLflow tracking server runs as its own systemd service on the
      # host (outside Docker, outside this repo) - see src/core/config.py
      # for why 172.17.0.1 (the Docker bridge gateway) is the default.
      - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI:-http://172.17.0.1:5000}
      - MLFLOW_EXPERIMENT_NAME=${MLFLOW_EXPERIMENT_NAME:-currency-forecast}
      - LLM_ENABLED=${LLM_ENABLED:-True}
      # UVICORN_WORKERS defaults to 1 in the Dockerfile itself - each
      # extra worker duplicates the whole process (pandas/numpy/
      # lightgbm/xgboost already loaded) in RAM. Only raise this if you
      # have real headroom to spare.
      - UVICORN_WORKERS=${UVICORN_WORKERS:-1}
    volumes:
      # Trained models are saved to "data/models" relative to the app's
      # /app working directory (ModelTrainer's and ForecastService's
      # shared default, in src/infrastructure/ml/trainers/trainer.py and
      # src/application/services/forecast_service.py) - i.e. inside
      # /app/data/models, not a separate /app/models. A "./models:/app/
      # models" mount used to sit here too, pointed at a path the app
      # never writes to, so trained models silently would not have
      # persisted across a container recreate.
      - ./data:/app/data
      - ./logs:/app/logs
      - ./src:/app/src
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - analytics-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Hard memory cap so this one container can never take down a small
    # VDS by itself. `mem_limit`/`mem_reservation` are the classic
    # docker-compose v1/v2 fields and are honoured by plain
    # `docker compose up` (unlike `deploy.resources`, which some older
    # Compose versions only apply under Swarm) - kept alongside `deploy`
    # below so both old and new tooling enforce the same limit.
    mem_limit: 768m
    mem_reservation: 256m
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M

  prometheus:
    image: prom/prometheus:latest
    container_name: currency-analytics-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      # Small VDS: cap how much disk/RAM Prometheus's own TSDB can use.
      - '--storage.tsdb.retention.time=7d'
      - '--storage.tsdb.retention.size=256MB'
    mem_limit: 256m
    profiles:
      - monitoring
    networks:
      - analytics-network

  grafana:
    image: grafana/grafana:latest
    container_name: currency-analytics-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
    mem_limit: 256m
    profiles:
      - monitoring
    networks:
      - analytics-network

volumes:
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  analytics-network:
    driver: bridge
