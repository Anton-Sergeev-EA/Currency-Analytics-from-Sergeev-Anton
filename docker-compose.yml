services:
  currency-analytics:
    build:
      context: .
      dockerfile: Dockerfile
    image: currency-analytics:${APP_VERSION:-latest}
    container_name: currency-analytics-app
    restart: unless-stopped
    user: "0:0"
    ports:
      - "8002:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/analytics.db}
      - REDIS_URL=redis://172.17.0.1:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - CBR_API_URL=${CBR_API_URL:-https://www.cbr.ru/scripts/XML_daily.asp}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - MODEL_PATH=/app/models
      - DATA_PATH=/app/data
      - OLLAMA_HOST=${OLLAMA_HOST:-http://172.17.0.1:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:3b}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://172.17.0.1:11434}
      - USE_OLLAMA=${USE_OLLAMA:-True}
      - LLM_ENABLED=${LLM_ENABLED:-True}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
      - ./src:/app/src
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - analytics-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  prometheus:
    image: prom/prometheus:latest
    container_name: currency-analytics-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    profiles:
      - monitoring
    networks:
      - analytics-network

  grafana:
    image: grafana/grafana:latest
    container_name: currency-analytics-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
    profiles:
      - monitoring
    networks:
      - analytics-network

volumes:
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  analytics-network:
    driver: bridge
