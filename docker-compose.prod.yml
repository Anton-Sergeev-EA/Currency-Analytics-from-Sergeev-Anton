services:
  currency-analytics:
    extends:
      file: docker-compose.yml
      service: currency-analytics
    restart: always
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s

  # A "db" service used to be extended here (docker-compose.yml has never
  # defined one, so `docker compose -f docker-compose.yml -f
  # docker-compose.prod.yml config` failed outright with "service 'db'
  # not found"), alongside a DATABASE_URL override pointing at it. Neither
  # is needed: the app has no SQL persistence layer that reads
  # DATABASE_URL (see src/core/config.py) - only Redis and the A/B test
  # module's own separate embedded SQLite file.

  nginx:
    image: nginx:alpine
    container_name: currency-analytics-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - currency-analytics
    networks:
      - analytics-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        